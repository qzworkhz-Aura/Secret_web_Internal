<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171717">
    <title>Masukkan Password — webf</title>
    <meta name="description" content="Halaman login untuk mengakses koleksi manga.">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/password.css">
</head>
<body>
    <main>
        <section class="password-container">
            <div class="lock-icon" aria-hidden="true">🔒</div>
            <h1 class="password-heading">Masukkan Password</h1>
            <p class="password-subheading">Konten ini dilindungi. Masukkan password untuk melanjutkan.</p>

            <form id="password-form" class="password-form" autocomplete="off">
                <div class="input-group">
                    <input
                        type="password"
                        id="password-input"
                        placeholder="Password"
                        autocomplete="current-password"
                        autofocus
                        required
                    >
                    <button
                        type="button"
                        id="password-toggle"
                        class="password-toggle"
                        aria-label="Tampilkan password"
                    >👁</button>
                    <button
                        type="submit"
                        id="password-submit"
                        class="password-submit"
                        aria-label="Submit"
                    >→</button>
                </div>
                <div id="password-feedback" class="password-feedback" aria-live="polite"></div>
            </form>

            <footer class="password-footer">
                <p>Buka console untuk generate hash baru:<br><code>generateHash('passwordBaru')</code></p>
            </footer>
        </section>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
