<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171717">
    <title>Webf</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta http-equiv="refresh" content="0; url=/password_pages.html">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #171717;
            color: #e6e6e6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .loading-wrapper {
            text-align: center;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #2a2a2a;
            border-top-color: #e6e6e6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p {
            font-size: 0.9rem;
            color: #737373;
        }
        a {
            color: #2f9dff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="loading-wrapper">
        <div class="spinner"></div>
        <p>Memuat... jika tidak dialihkan otomatis, <a href="/password_pages.html">klik di sini</a>.</p>
    </div>

    <script>
        // Cek session login langsung
        (function() {
            try {
                const sessionKey = "webf_auth_session";
                const raw = localStorage.getItem(sessionKey);
                if (raw) {
                    const session = JSON.parse(raw);
                    const elapsed = Date.now() - session.timestamp;
                    if (session.authenticated && elapsed < session.expiresIn) {
                        window.location.replace('/home.html');
                        return;
                    }
                }
            } catch (e) {}
            // Jika belum login / expired, arahkan ke password page
            window.location.replace('/password_pages.html');
        })();

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
